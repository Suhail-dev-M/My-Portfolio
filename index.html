<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SUHAIL</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #04050a;
  }
  canvas { display: block; }

  .hint {
    position: fixed;
    left: 50%;
    bottom: 26px;
    transform: translateX(-50%);
    font: 500 11px/1 ui-monospace, "SF Mono", Menlo, monospace;
    letter-spacing: .38em;
    text-transform: uppercase;
    color: rgba(150, 205, 255, .38);
    pointer-events: none;
    user-select: none;
    animation: breathe 6s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { opacity: .22; }
    50%      { opacity: .75; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hint">move your cursor</div>

<script>
(() => {
  'use strict';

  const canvas = document.getElementById('c');
  const ctx    = canvas.getContext('2d', { alpha: false });

  const WORD = 'SUHAIL';
  const TAU  = Math.PI * 2;

  const pointer = { x: -1e4, y: -1e4 };

  let W = 0, H = 0, dpr = 1;
  let particles = [];
  let frame = 0;

  /* ------------------------------------------------------------------ */
  /*  Particle                                                           */
  /* ------------------------------------------------------------------ */
  class Particle {
    constructor(tx, ty, gap) {
      this.tx = tx;                       // target x
      this.ty = ty;                       // target y

      // start scattered around the centre, off in the dark
      const ang = Math.random() * TAU;
      const rad = Math.max(W, H) * (0.42 + Math.random() * 0.55);
      this.x = W * 0.5 + Math.cos(ang) * rad;
      this.y = H * 0.5 + Math.sin(ang) * rad;

      this.vx = 0;
      this.vy = 0;

      // spring + damping (randomised → staggered arrival)
      this.k     = 0.012 + Math.random() * 0.026;
      this.damp  = 0.885 + Math.random() * 0.05;
      this.phase = Math.random() * TAU;
      this.size  = gap * (0.30 + Math.random() * 0.28);

      // cyan → blue → violet across the word
      const hue = 188 + (tx / W) * 112;
      this.color = 'hsla(' + hue.toFixed(1) + ',100%,55%,0.45)';
    }

    update(t) {
      // gentle idle shimmer
      const wobX = Math.sin(t + this.phase) * 1.8;
      const wobY = Math.cos(t * 1.27 + this.phase) * 1.8;

      this.vx += (this.tx + wobX - this.x) * this.k;
      this.vy += (this.ty + wobY - this.y) * this.k;

      // pointer repulsion
      const mdx = this.x - pointer.x;
      const mdy = this.y - pointer.y;
      const R   = 140;
      const d2  = mdx * mdx + mdy * mdy;

      if (d2 < R * R && d2 > 0.0001) {
        const d = Math.sqrt(d2);
        const f = (1 - d / R) * 5.5;
        this.vx += (mdx / d) * f;
        this.vy += (mdy / d) * f;
      }

      this.vx *= this.damp;
      this.vy *= this.damp;

      // speed clamp so the initial rush stays smooth
      const sp2 = this.vx * this.vx + this.vy * this.vy;
      if (sp2 > 484) {                    // 22 px / frame
        const s = 22 / Math.sqrt(sp2);
        this.vx *= s;
        this.vy *= s;
      }

      this.x += this.vx;
      this.y += this.vy;
    }

    draw() {
      ctx.fillStyle = this.color;
      ctx.fillRect(
        this.x - this.size * 0.5,
        this.y - this.size * 0.5,
        this.size,
        this.size
      );
    }
  }

  /* ------------------------------------------------------------------ */
  /*  Build particle cloud from the text shape                           */
  /* ------------------------------------------------------------------ */
  function buildText() {
    const off  = document.createElement('canvas');
    off.width  = W;
    off.height = H;
    const o = off.getContext('2d');

    const fontSize = Math.min(W * 0.17, H * 0.40);

    o.textAlign    = 'center';
    o.textBaseline = 'middle';
    o.fillStyle    = '#fff';
    o.font = '900 ' + fontSize +
             'px "Arial Black","Helvetica Neue",Impact,system-ui,sans-serif';

    o.fillText(WORD, W * 0.5, H * 0.5);

    const data = o.getImageData(0, 0, W, H).data;
    const gap  = Math.max(3, Math.round(fontSize / 52));

    particles.length = 0;

    for (let y = 0; y < H; y += gap) {
      for (let x = 0; x < W; x += gap) {
        if (data[(y * W + x) * 4 + 3] > 128) {
          particles.push(
            new Particle(
              x + (Math.random() - 0.5) * gap,
              y + (Math.random() - 0.5) * gap,
              gap
            )
          );
        }
      }
    }
  }

  /* ------------------------------------------------------------------ */
  /*  Resize                                                             */
  /* ------------------------------------------------------------------ */
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);

    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width  = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    canvas.style.width  = W + 'px';
    canvas.style.height = H + 'px';

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#04050a';
    ctx.fillRect(0, 0, W, H);

    buildText();
  }

  let resizeTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(resize, 180);
  });

  /* ------------------------------------------------------------------ */
  /*  Pointer                                                            */
  /* ------------------------------------------------------------------ */
  window.addEventListener('pointermove', (e) => {
    pointer.x = e.clientX;
    pointer.y = e.clientY;
  }, { passive: true });

  window.addEventListener('mouseout', (e) => {
    if (!e.relatedTarget) { pointer.x = -1e4; pointer.y = -1e4; }
  });

  window.addEventListener('blur', () => {
    pointer.x = -1e4;
    pointer.y = -1e4;
  });

  /* ------------------------------------------------------------------ */
  /*  Main loop                                                          */
  /* ------------------------------------------------------------------ */
  function loop() {
    frame++;
    const t = frame * 0.02;

    // motion-trail fade
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = 'rgba(4,5,10,0.30)';
    ctx.fillRect(0, 0, W, H);

    // additive neon blending
    ctx.globalCompositeOperation = 'lighter';

    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      p.update(t);
      p.draw();
    }

    requestAnimationFrame(loop);
  }

  /* ------------------------------------------------------------------ */
  resize();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
